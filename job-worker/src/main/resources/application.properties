spring.application.name=job-worker
server.port=0

spring.datasource.url=jdbc:postgresql://localhost:5432/jobflow
spring.datasource.username=jobflow_user
spring.datasource.password=jobflow_password
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=job-worker-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
