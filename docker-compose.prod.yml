services:
  # =========================================================================
  # 1. Reverse Proxy (HTTPS / SSL Termination & Unified Routing)
  # =========================================================================
  reverse-proxy:
    image: nginx:alpine
    container_name: jobflow-reverse-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - job-service
    networks:
      - jobflow-net

  # =========================================================================
  # 2. PostgreSQL (Relational State, Outbox, and Scheduled Retries)
  # =========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: jobflow-postgres
    restart: always
    environment:
      POSTGRES_USER: jobflow_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobflow_password}
      POSTGRES_DB: jobflow
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobflow_user -d jobflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobflow-net

  # =========================================================================
  # 3. Lightweight 1-Node Kafka Broker (KRaft Mode, Low RAM Footprint)
  # =========================================================================
  kafka:
    image: apache/kafka:3.7.0
    container_name: jobflow-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list",
        ]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - jobflow-net

  # =========================================================================
  # 4. Redis (Distributed Lock Manager & Host Rate Limiting)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: jobflow-redis
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jobflow-net

  # =========================================================================
  # 5. Job Service API (Spring Boot REST Engine & Outbox Publisher)
  # =========================================================================
  job-service:
    build:
      context: ./job-service
    container_name: jobflow-service
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JOBFLOW_AUTH_USER_PASSWORD=${JOBFLOW_AUTH_USER_PASSWORD:-user123}
      - JOBFLOW_AUTH_ADMIN_PASSWORD=${JOBFLOW_AUTH_ADMIN_PASSWORD:-admin123}
      - JOBFLOW_M2M_API_KEY=${JOBFLOW_M2M_API_KEY:-jobflow_live_secret_key_12345}
      - JOBFLOW_JWT_SECRET=${JOBFLOW_JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - JOBFLOW_JWT_EXPIRATION_MS=${JOBFLOW_JWT_EXPIRATION_MS:-36000000}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/jobflow
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-jobflow_password}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_REDIS_HOST=redis
      - APP_FRONTEND_URL=${APP_FRONTEND_URL:-https://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobflow-net

  # =========================================================================
  # 6. Job Worker Cluster (Horizontally Scalable Task Consumer)
  # =========================================================================
  job-worker:
    build:
      context: ./job-worker
    restart: always
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/jobflow
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-jobflow_password}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_REDIS_HOST=redis
    depends_on:
      job-service:
        condition: service_started
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jobflow-net

  # =========================================================================
  # 7. Frontend SPA (Production Compiled Bundle via Nginx)
  # =========================================================================
  frontend:
    build:
      context: ./frontend
    container_name: jobflow-frontend
    restart: always
    depends_on:
      - job-service
    networks:
      - jobflow-net

volumes:
  postgres_prod_data:

networks:
  jobflow-net:
    driver: bridge
