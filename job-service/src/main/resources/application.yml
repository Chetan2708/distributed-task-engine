spring:
  application:
    name: job-service
  profiles:
    active: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/jobflow}
    username: jobflow_user
    password: ${DB_PASSWORD:jobflow_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all

jobflow:
  auth:
    user:
      username: ${JOBFLOW_AUTH_USER_USERNAME:user}
      password: ${JOBFLOW_AUTH_USER_PASSWORD:changeme}
    admin:
      username: ${JOBFLOW_AUTH_ADMIN_USERNAME:admin}
      password: ${JOBFLOW_AUTH_ADMIN_PASSWORD:changeme}
    api-key: ${JOBFLOW_M2M_API_KEY:jobflow_live_secret_key_12345}
    api-key-client: ${JOBFLOW_M2M_CLIENT_NAME:m2m-service}
  jwt:
    secret: ${JOBFLOW_JWT_SECRET:default-dev-secret-key-that-is-at-least-256-bits-long-for-hmac-sha}
    expiration-ms: ${JOBFLOW_JWT_EXPIRATION_MS:36000000}
  kafka:
    replication-factor: 1
    min-insync-replicas: "1"
app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:5173}
management:
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health
